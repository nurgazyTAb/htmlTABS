<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Анкета студента</title>
</head>
<body>

    <h1>Анкета студента</h1>

    <form>
        <label>ФИО:</label><br>
        <input type="text" placeholder="Введите ФИО"><br><br>

        <label>Дата рождения:</label><br>
        <input type="date"><br><br>

        <label>Группа:</label><br>
        <input type="text" placeholder="Например: SCA25C"><br><br>

        <label>Факультет:</label><br>
        <input type="text" placeholder="Введите факультет"><br><br>

        <label>Специальность:</label><br>
        <input type="text" placeholder="Введите специальность"><br><br>

        <label>Пол:</label><br>
        <input type="radio" name="gender"> Мужской
        <input type="radio" name="gender"> Женский
        <br><br>

        <label>Город:</label><br>
        <input type="text" placeholder="Введите город"><br><br>

        <label>Номер телефона:</label><br>
        <input type="tel" placeholder="+996 ..."><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="example@mail.com"><br><br>

        <label>О себе:</label><br>
        <textarea rows="5" cols="40" placeholder="Расскажите немного о себе"></textarea><br><br>

        <label>Любимый предмет:</label><br>
        <select>
            <option>Программирование</option>
            <option>Математика</option>
            <option>Английский язык</option>
            <option>Физика</option>
            <option>Другое</option>
        </select><br><br>

        <button type="submit">Отправить анкету</button>
        <button type="reset">Очистить</button>
    </form><br>
