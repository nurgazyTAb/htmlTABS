<h2>Trip Application</h2>

<p>This is a practice form. It does not send or store information.</p>

<form>

<figure>
    <legend>1. Participant</legend>

    <p>
        <label>Full name *<br>
        <input type="text" required></label>
    </p>

    <p>
        <label>Email *<br>
        <input type="email" required></label>
    </p>

    <p>
        <label>Student group<br>
        <input type="text"></label>
    </p>


<br>


    <legend>2. Trip choice</legend>

    <p>
        <label>Route *<br>
        <select required>
            <option>Choose a route</option>
            <option>River Walk</option>
            <option>Forest Trail</option>
            <option>Ridge View</option>
        </select>
        </label>
    </p>

    <p>
        <label>Preferred date *<br>
        <input type="date" required></label>
    </p>

    <p>
        <label>Number of participants (1–4)<br>
        <input type="number" min="1" max="4" value="1"></label>
    </p>


<br>


    <legend>3. Experience</legend>

    <p>
        <input type="radio" name="experience">
        Beginner<br>

        <input type="radio" name="experience">
        I hike regularly
    </p>
